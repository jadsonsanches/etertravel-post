<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Éter Travel Editorial Carousel</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0A0F14;
      color: #FFFFFF;
      position: relative;
    }

    /* Imagem de Fundo Limpa e Clara (Vogue / Condé Nast Style) */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1350px;
      object-fit: cover;
      filter: brightness(0.92) contrast(1.04);
      z-index: 1;
    }

    /* Degradê Suave de Luz Natural (Proteção de leitura) */
    .overlay-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.45) 0%,
        rgba(0, 0, 0, 0.10) 35%,
        rgba(0, 0, 0, 0.10) 65%,
        rgba(0, 0, 0, 0.55) 100%
      );
      z-index: 2;
    }

    /* Granulado Editorial Texturizado nas Fotos (Noise Texture sobre a Imagem) */
    .noise-texture {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1350px;
      opacity: 0.30;
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 3;
    }

    /* Container Principal */
    .slide-container {
      position: relative;
      z-index: 5;
      width: 1080px;
      height: 1350px;
      padding: 75px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Área de Conteúdo Flexível */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-top: 30px;
      padding-bottom: 30px;
    }

    /* -------------------------------------------------------------
       VARIAÇÕES DINÂMICAS DE LAYOUT (Estética Magazine Grid Limpa - Sem Caixas e Sem Text-Shadow)
       ------------------------------------------------------------- */
    /* Cover (Slide 1) */
    .layout-cover .cover-title-block {
      margin-top: 40px;
      max-width: 920px;
    }

    .layout-cover .cover-footer-block {
      margin-top: auto;
      max-width: 880px;
    }

    .cover-main-title {
      font-family: 'Playfair Display', serif;
      font-size: 88px;
      line-height: 1.08;
      font-weight: 500;
      color: #FFFFFF;
      letter-spacing: 0.5px;
      text-shadow: none;
    }

    .cover-subtitle {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 30px;
      line-height: 1.5;
      font-weight: 300;
      color: #F8FAFC;
      text-shadow: none;
    }

    /* Card de Destino (Top Left) */
    .layout-top-left {
      align-items: flex-start;
      justify-content: flex-start;
      text-align: left;
    }

    /* Card de Destino (Top Center) */
    .layout-top-center {
      align-items: center;
      justify-content: flex-start;
      text-align: center;
    }

    /* Card de Destino (Bottom Left) */
    .layout-bottom-left {
      align-items: flex-start;
      justify-content: flex-end;
      text-align: left;
    }

    /* Card de Destino (Bottom Right) */
    .layout-bottom-right {
      align-items: flex-end;
      justify-content: flex-end;
      text-align: right;
    }

    /* Estilos Tipográficos de Revista Limpos (Sem sombra de texto) */
    .destination-block {
      max-width: 880px;
    }

    .place-name {
      font-family: 'Playfair Display', serif;
      font-size: 84px;
      line-height: 1.06;
      font-weight: 500;
      color: #FFFFFF;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
      text-shadow: none;
    }

    .place-location {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.8px;
      color: #F1F5F9;
      margin-bottom: 22px;
      text-transform: uppercase;
      text-shadow: none;
    }

    .editorial-body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 28px;
      line-height: 1.55;
      font-weight: 300;
      color: #FFFFFF;
      text-shadow: none;
    }

    /* Footer Minimalista */
    .footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      width: 100%;
      padding-top: 20px;
    }

    .swipe-hint {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
      opacity: 0.95;
      text-shadow: none;
    }
  </style>
</head>
<body>
  <img class="bg-image" src="{{UNSPLASH_IMAGE_URL}}" alt="Éter Travel" />
  
  <div class="overlay-gradient"></div>

  <!-- SVG Noise Filter sobre a foto (z-index: 3) -->
  <svg class="noise-texture" xmlns="http://www.w3.org/2000/svg">
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.80" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
  </svg>

  <div class="slide-container">
    <!-- Conteúdo com Layout Dinâmico -->
    <div class="content-area {{LAYOUT_CLASS}}">
      {{SLIDE_CONTENT_HTML}}
    </div>

    <div class="footer">
      <div class="swipe-hint">Deslize para explorar &rarr;</div>
    </div>
  </div>
</body>
</html>
