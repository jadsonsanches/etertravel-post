<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Éter Travel Editorial Story (9:16)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0A0F14;
      color: #FFFFFF;
      position: relative;
    }

    /* Imagem de Fundo Limpa e Clara (Vogue / Condé Nast Style) - Story 9:16 */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      filter: brightness(0.90) contrast(1.05);
      z-index: 1;
    }

    /* Degradê Suave de Luz Natural (Proteção de leitura estendida para Story) */
    .overlay-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.50) 0%,
        rgba(0, 0, 0, 0.15) 25%,
        rgba(0, 0, 0, 0.15) 70%,
        rgba(0, 0, 0, 0.65) 100%
      );
      z-index: 2;
    }

    /* Granulado Editorial Texturizado nas Fotos */
    .noise-texture {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      opacity: 0.28;
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 3;
    }

    /* Container Principal com Margens Seguras para Instagram Stories (evita topo/botão do app) */
    .story-container {
      position: relative;
      z-index: 5;
      width: 1080px;
      height: 1920px;
      padding: 160px 80px 180px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Tag de Topo */
    .story-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .story-tag {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 20px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #F1F5F9;
      font-weight: 500;
      opacity: 0.9;
    }

    /* Área Conteúdo Central/Inferior */
    .story-content {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 920px;
    }

    .story-title {
      font-family: 'Playfair Display', serif;
      font-size: 88px;
      line-height: 1.08;
      font-weight: 500;
      color: #FFFFFF;
      letter-spacing: 0.5px;
    }

    .story-location {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 30px;
      font-weight: 400;
      letter-spacing: 1px;
      color: #F1F5F9;
      text-transform: uppercase;
    }

    .story-body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 30px;
      line-height: 1.55;
      font-weight: 300;
      color: #FFFFFF;
    }

    /* Rodapé do Story */
    .story-footer {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .story-cta {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 20px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #FFFFFF;
      font-weight: 500;
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <img class="bg-image" src="{{UNSPLASH_IMAGE_URL}}" alt="Éter Travel Story" />
  
  <div class="overlay-gradient"></div>

  <svg class="noise-texture" xmlns="http://www.w3.org/2000/svg">
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.80" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
  </svg>

  <div class="story-container">
    <div class="story-header">
      <span class="story-tag">{{SLIDE_TAG}}</span>
    </div>

    <div class="story-content">
      <h1 class="story-title">{{TITLE}}</h1>
      {{LOCATION_HTML}}
      <p class="story-body">{{BODY}}</p>
    </div>

    <div class="story-footer">
      <div class="story-cta">Éter Travel &bull; Experiências Autorais</div>
    </div>
  </div>
</body>
</html>
